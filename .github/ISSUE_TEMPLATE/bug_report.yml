name: Bug report
description: Report a problem with WhisperOS
labels: ["bug"]
body:
  - type: dropdown
    id: device
    attributes:
      label: Device / board
      options:
        - Heltec V3
        - Heltec V4
        - Heltec T114
        - RAK4631
        - Faketec/ProMicro
        - Wio Tracker L1
        - M5Stack Cardputer
        - Other
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: Shown in the app, e.g. 1.4.4
      placeholder: "1.4.4"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      description: How the device connects to your app
      options:
        - BLE
        - USB
        - None
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so others can repeat the problem.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Optional. Anything that helps show the problem.
    validations:
      required: false
