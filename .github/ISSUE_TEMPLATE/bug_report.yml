name: Bug report
description: Report a problem with WhisperOS
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Device / board
      placeholder: Heltec V4, Faketec v5, RAK4631
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: Shown on the boot screen and in the System screen.
      placeholder: "1.4.4"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      description: How the device connects to your app
      options:
        - BLE
        - USB
        - Not connected
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so others can repeat the problem.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Optional. Anything that helps show the problem.
    validations:
      required: false
